server:
  port: 8085
spring:
  application:
    name: reporting-audit-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reporting_audit_service_db?currentSchema=reporting_audit_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: reporting_audit_service
        format_sql: true
clients:
  parking-operation-service:
    url: ${PARKING_OPERATION_SERVICE_URL:http://localhost:8082/api}
  payment-cash-service:
    url: ${PAYMENT_CASH_SERVICE_URL:http://localhost:8084/api}
  sql:
    init:
      mode: always
